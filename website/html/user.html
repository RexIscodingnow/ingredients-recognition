{% extends "base.html" %}

{% block title %}
    家常好食 — 會員頁面
{% endblock %}


{% block main_tag_content %}
<link rel="stylesheet" href="../static/user.css">

<section class="user-profile container">
    <div class="profile-header">
        <div class="user-info">
            <h2>{{ user.username }}</h2>
            <p class="email">{{ user.email }}</p>
            <div class="profile-actions">
                <button class="btn btn-outline" id="btn-edit-profile">編輯資料</button>
                <button class="btn btn-primary">上傳新食譜</button>
            </div>
        </div>
    </div>

    <section class="user-section">
        <h3>食譜評分</h3>
        <form id="rating-form" action="{{ url_for('submit_rating') }}" method="post">
            <div class="user-form-group">
                <label for="recipe">選擇要評分的食譜</label>
                <select id="recipe" name="recipe_id" required>
                    {% for recipe in all_recipes %}
                        <option value="{{ recipe.recipe_id }}">{{ recipe.recipe_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="user-form-group">
                <label for="rating">分數 (1 ~ 5)</label>
                <select id="rating" name="rating" required>
                    <option value="">請選擇</option>
                    <option value="1">1 - 很差</option>
                    <option value="2">2 - 普通</option>
                    <option value="3">3 - 還不錯</option>
                    <option value="4">4 - 很好</option>
                    <option value="5">5 - 超讚！</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn btn-primary">送出評分</button>
            </div>
        </form>

    </section>

    <hr style="margin: 30px 0;">
    <section class="user-section">
        <h3>上傳食材照片</h3>

        <form id="upload-form" action="{{ url_for('upload_ingred') }}" method="post" enctype="multipart/form-data">
            <div class="user-form-group">
                <label>上傳食譜照片（最多 5 張）</label>

                <!-- 拖曳與貼上區 -->
                <div id="drop-area" class="drop-area">
                    <p>拖曳圖片到這裡，或點擊以下按鈕選取<br><small>(可貼上圖片)</small></p>
                    <input type="file" id="photos" name="photos" accept="image/*" multiple hidden>
                    <button type="button" id="select-btn" class="btn btn-outline">選擇圖片</button>
                </div>

                <small style="color:var(--muted)">支援 JPG、PNG，最多 5 張，每張建議小於 5MB。</small>
            </div>

            <div id="preview-container" class="preview-container"></div>

            <div class="modal-actions">
                <button type="reset" id="clear-imgs-btn" class="btn btn-outline">清除</button>
                <button type="submit" class="btn btn-primary">上傳</button>
            </div>

            <p id="upload-status" style="margin-top:10px; text-align:center; color:var(--muted)"></p>
        </form>

        <p id="detected"></p>
        <p id="show-detected-ingreds"></p>

        <!-- <h3>我的收藏食譜</h3> -->

        <!-- {% if favorites %}
        <div class="recipe-grid">
            {% for recipe in favorites %}
            <div class="recipe-card">
                <a href="{{ recipe.recipe_info_url }}">{{ recipe.recipe_name }} 的相關網址資訊</a>
                <div class="recipe-info">
                    <h4>{{ recipe.recipe_name }}</h4>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p style="color:var(--muted)">目前還沒有收藏任何食譜～</p>
        {% endif %} -->
    </section>

    <!-- <section class="user-section">
        <h3>我上傳的食譜</h3>
        {% if uploads %}
        <div class="recipe-grid">
            {% for recipe in uploads %}
            <div class="recipe-card">
                <div class="recipe-info">
                    <h4>{{ recipe.title }}</h4>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <small>{{ recipe.category }}</small>
                        <a href="{{ url_for('edit_recipe', id=recipe.id) }}" class="btn btn-outline btn-small">編輯</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p style="color:var(--muted)">您還沒有上傳任何食譜。</p>
        {% endif %}
    </section> -->

</section>

<!-- Modal: 編輯資料 -->
<div class="user-modal-backdrop" id="user-edit-modal">
    <div class="user-modal" role="dialog" aria-modal="true">
        <button id="user-edit-close" style="float:right; border:0; background:transparent; font-size:18px;">✕</button>
        <h3>編輯個人資料</h3>

        <form id="user-edit-form">
            <div class="user-form-group">
                <label>使用者名稱</label>
                <input id="username" type="text" value="{{ user.username }}">
            </div>
            <div class="user-form-group">
                <label>電子郵件</label>
                <input id="email" type="email" value="{{ user.email }}">
            </div>
            <div class="user-form-group">
                <label>確認密碼</label>
                <input id="password" type="password" placeholder="請輸入原密碼進行更改">
            </div>
            <div class="user-form-group">
                <label>更新密碼</label>
                <input id="new-password" type="password" placeholder="請輸入新密碼（選填，若沒有要更新則留空）">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="user-edit-cancel">取消</button>
                <button type="submit" class="btn btn-primary">儲存</button>
            </div>
        </form>
    </div>
</div>

<script src="../static/user.js"></script>

{% endblock %}
